version: "1.0.0"
hooks:
  pre-commit:
    - command: "bash"
      args: ["scripts/assess-root-module.sh", "pre-commit"]
      priority: 10
      timeout: "90s"
    - command: "bash"
      args: ["scripts/assess-schema-contracts.sh", "format,lint"]
      priority: 9
      timeout: "90s"
  pre-push:
    - command: "bash"
      args: ["scripts/assess-root-module.sh", "pre-push"]
      priority: 10
      timeout: "2m"
    - command: "bash"
      args: ["scripts/assess-schema-contracts.sh", "format,lint,security"]
      priority: 9
      timeout: "2m"
optimization:
  cache_results: true
  content_source: working
  only_changed_files: true
  parallel: auto
