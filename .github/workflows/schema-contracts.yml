name: Schema Contracts
'on':
  push:
  pull_request:
permissions:
  contents: read
jobs:
  schema-contracts:
    name: Schema Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: scripts/schema-contracts/go.sum
      - name: Strict inventory and offline compilation
        run: make validate-schema-contracts
      - name: Adversarial controls and ADR runtime contracts
        if: ${{ !cancelled() }}
        run: make test-schema-contracts
