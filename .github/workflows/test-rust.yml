name: Test Rust
"on":
  push:
  pull_request:
jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f  # v1
        with:
          toolchain: "1.89"
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: lang/rust
          # Cache key includes toolchain version to auto-bust on upgrades
          # Increment manually if you need to force cache invalidation
          key: v1-toolchain-1.89
      - name: Check formatting
        working-directory: ./lang/rust
        run: cargo fmt --check
      - name: Lint
        working-directory: ./lang/rust
        run: cargo clippy -- -D warnings
      - name: Build
        working-directory: ./lang/rust
        run: cargo build
      - name: Test
        working-directory: ./lang/rust
        run: cargo test
